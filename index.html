<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets us use the full iPhone screen incl. notch areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0b0f" />
    <!-- These make "Add to Home Screen" open full-screen (standalone) on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lift Log" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Lift Log – Voice Spike</title>
  </head>
  <body>
    <main id="app">
      <!-- Status / diagnostics: tells us exactly what this iPhone supports -->
      <section id="diag" class="diag"></section>

      <!-- What the speech engine heard -->
      <section class="transcript-box">
        <div id="state" class="state">Ready</div>
        <div id="transcript" class="transcript">Hold the button and say<br>"bench, 185, 8 reps"</div>
        <div id="interim" class="interim"></div>
      </section>

      <!-- Event log for debugging (tap to expand) -->
      <details class="log">
        <summary>Event log</summary>
        <ol id="log"></ol>
        <button id="mic-test" type="button" class="small-btn">Test raw mic recording (fallback path)</button>
        <button id="mode-toggle" type="button" class="small-btn">Mode: hold to talk</button>
      </details>

      <!-- The giant push-to-talk button -->
      <button id="record" class="record" type="button" aria-label="Hold to record">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z" />
        </svg>
      </button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

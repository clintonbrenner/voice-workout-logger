<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets us use the full iPhone screen incl. notch areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0b0f" />
    <!-- These make "Add to Home Screen" open full-screen (standalone) on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lift Log" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Lift Log</title>
  </head>
  <body>
    <!-- Tabs along the top, so the bottom stays free for your thumb -->
    <nav id="tabs" class="tabs">
      <button type="button" data-tab="workout">Workout</button>
      <button type="button" data-tab="plan">Plan</button>
      <button type="button" data-tab="progress">Progress</button>
      <button type="button" data-tab="history">History</button>
    </nav>

    <main id="view-workout" class="view">
      <div id="workout-header" class="workout-header"></div>
      <div id="exercise-list" class="exercise-list"></div>
    </main>
    <main id="view-plan" class="view" hidden></main>
    <main id="view-progress" class="view" hidden>
      <section class="panel"><h2>Progress</h2><p class="muted">Charts and personal records arrive in milestone 5.</p></section>
    </main>
    <main id="view-history" class="view" hidden>
      <section class="panel"><h2>History</h2><p class="muted">Past sessions and CSV export arrive in milestone 4.</p></section>
    </main>

    <!-- Bottom dock (Workout tab only): confirmation card + giant record button -->
    <div id="dock" class="dock">
      <div id="confirm" class="confirm" hidden></div>
      <div id="live" class="live">Hold to log a set</div>
      <button id="record" class="record" type="button" aria-label="Hold to record">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z" />
        </svg>
      </button>
    </div>

    <div id="toast" class="toast" hidden></div>
    <div id="sheet" class="sheet" hidden></div>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
